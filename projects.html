---
layout: page
title: Projects
permalink: /projects/
---

<h3 class="randomcolor">Projects</h3>

{% for item in site.data.projects %}
<div class="project-item">
    <div class="project-title">
    {% if item.projectURL %}
        <h3 class="project-header"><a class="randomcolor" href="{{ item.projectURL }}" target="_blank"> {{ item.projectName }} </a></h3>
    {% else %}
        <h3 class="randomcolor project-header"> {{ item.projectName }} </h3>
    {% endif %}
    {% if item.projectGithub %}
        <a class="randomcolor" href="{{ item.projectGithub }}" target="_blank"> (source)</a>
    {% endif %}
    </div>
        <p class="project-description"> {{ item.projectDescription }} </p>
</div>
{% endfor %}
