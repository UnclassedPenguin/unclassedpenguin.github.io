title: Unclassed Blog 
permalink: /:year/:title/
description: >- # this means to ignore newlines until "baseurl:"
  Unclassed Blog
baseurl:  # the subpath of your site, e.g. /blog
url: https://unclassed.ca # the base hostname & protocol for your site, e.g. http://example.com

excerpt_separator: <!--more-->

plugins:
  - jekyll-feed

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge


exclude:
  - README.md
