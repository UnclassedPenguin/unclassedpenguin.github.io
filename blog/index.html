---
layout: page
---

<div>
      <ul>
      {%- for post in site.posts -%}
      <li>
        <h2><a class="post-link randomcolor" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
        {{ post.date | date: "%B %-d, %Y" }} 
        
        {{ post.excerpt }}
        
      </li>
      {%- endfor -%}
    </ul>
</div>
