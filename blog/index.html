---
layout: page
---

<div>
      <ul>
      {%- for post in site.posts -%}
      <li>
        <h3>
          <a class="post-link randomcolor" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}

          </a>
        </h3>
        <p> {{ post.date | date: "%B %-d, %Y" }} </p>
        <p>
         {{ post.excerpt }}
        </p>
      </li>
      <br>
      {%- endfor -%}
    </ul>
</div>
