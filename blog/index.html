---
layout: page
---

<div>
      <ul>
      {%- for post in site.posts -%}
      <li>
        <h3><a class="post-link randomcolor" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>

        <div class="inline-block">
        {{ post.date | date: "%B %-d, %Y" }} 
        -
        {{ post.author }}
        </div>
        
        {{ post.excerpt }}
        
      </li>
      {%- endfor -%}
    </ul>
</div>
