---
layout: default 
---


<h2 class="randomcolor"> {{ page.title }} </h2>

{% if page.image and page.photoBy and page.photoByURL and page.photoFromURL and page.photoFromURL %}
    <img class="post-image" src="{% if page.image contains "://" %}{{ page.image }}{% else %}{{ site.baseurl }}/{{ page.image }}{% endif %}"   alt="{{ page.title }}">

    <div class="photo-credit">Photo by <a class="randomcolor" href="{{ page.photoByURL }}" target="_blank">{{ page.photoBy }}</a> from <a                    class="randomcolor" href="{{ page.photoFromURL }}" target="_blank">{{ page.photoFrom }}</a></div>
{% endif %}

<div class="inline-block margin-bottom">
{{ page.date | date: "%B %-d, %Y" }}
-
{{ page.author }}
</div>

{{ content }}
